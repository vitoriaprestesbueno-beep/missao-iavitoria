<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Você decide seu bem-estar</title>
</head>

<body>

    <div class="caixa-principal">

        <div class="decoracao">🌷</div>

        <h1>Você decide seu bem-estar</h1>

        <p class="subtitulo">
            Pequenas escolhas podem transformar sua história 💚
        </p>

        <div class="progresso">
            <div class="barra-progresso"></div>
        </div>

        <p class="numero-pergunta"></p>

        <div class="caixa-perguntas"></div>

        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">

            <div class="icone-resultado">
                🌿
            </div>

            <h2>Sua jornada terminou!</h2>

            <p class="texto-resultado"></p>

            <button class="botao-reiniciar">
                Refazer minha jornada 💗
            </button>

        </div>

    </div>

    <script src="arrayUnidade.js"></script>
    <script src="script.js"></script>

</body>

</html>
